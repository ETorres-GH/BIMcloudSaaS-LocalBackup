name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regras:
    name: regras do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Preparar validador da base
        run: |
          if git cat-file -e "$BASE_SHA:scripts/check_pr.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check_pr.py" > "$RUNNER_TEMP/check_pr.py"
          else
            cp scripts/check_pr.py "$RUNNER_TEMP/check_pr.py"
          fi

      - name: Validar regras do projeto
        run: python "$RUNNER_TEMP/check_pr.py" --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Instalar Gitleaks com checksum verificado
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Procurar segredos no diff
        run: git diff "$BASE_SHA...$HEAD_SHA" | ./gitleaks --redact --no-banner stdin

  # windows-latest é o Windows Server 2025; o Server 2022 roda com o Python mínimo. Os nomes
  # "test (Python X)" são as verificações obrigatórias do main: não mudar.
  test:
    name: >-
      ${{ matrix.os == 'windows-latest'
      && format('test (Python {0})', matrix.python-version)
      || format('test (Python {0}, {1})', matrix.python-version, matrix.os) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-2022
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Atualizar o pip
        run: python -m pip install --upgrade --require-hashes -r requirements-pip.txt

      - name: Instalar dependências conferidas
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Instalar o programa
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Auditar dependências de CI
        if: matrix.python-version == '3.13'
        run: python -m pip_audit --strict --require-hashes -r requirements-ci.txt

      - name: Auditar dependências de build
        if: matrix.python-version == '3.13'
        run: python -m pip_audit --strict --require-hashes -r requirements-build.txt

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Testes
        run: pytest

  instalador:
    name: instalador (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Inno Setup (versão fixa, SHA-256 e assinatura conferidos)
        run: .\scripts\install_inno.ps1

      # Confere só o script do instalador: um executável qualquer do Windows faz o papel do
      # programa, que é gerado de verdade apenas na Release.
      - name: Compilar o instalador com um executável de teste
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$env:SystemRoot\System32\whoami.exe" dist\BIMcloudBackup.exe
          .\scripts\build_installer.ps1 -Required
          if (-not (Test-Path dist\BIMcloudBackup-Setup.exe)) { throw "Instalador não gerado" }
