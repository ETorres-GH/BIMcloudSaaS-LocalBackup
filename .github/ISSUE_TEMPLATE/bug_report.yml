name: 🐛 Reportar bug
description: Algo não está funcionando como esperado.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Não cole senhas, tokens nem endereços internos. Os logs e o `.backup.json` trazem nomes de
        projetos, pastas e clientes: troque por nomes genéricos (`ProjetoA`, `PastaB`) antes de
        colar. Não anexe arquivos `.pln`, `.BIMProject` ou `.BIMLibrary`.
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Configurei ...
        2. Rodei `bimcloud-backup ...`
        3. Apareceu o erro ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / mensagem de erro
      description: >-
        Os logs ficam em %LOCALAPPDATA%\BIMcloudSaaS-LocalBackup\logs. Troque os nomes de
        projetos, pastas e clientes por nomes genéricos antes de colar.
      render: text
  - type: input
    id: versao
    attributes:
      label: Versão do BIMcloudSaaS-LocalBackup
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: "Windows 11 23H2"
  - type: input
    id: archicad
    attributes:
      label: Versão do Archicad / BIMcloud
      placeholder: "Archicad 28"
