name: 🐛 Bug report / Reportar bug
description: Something is not working as expected. / Algo não está funcionando como esperado.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English or Portuguese are both fine. / Pode escrever em inglês ou português.

        Do not paste passwords, tokens or internal addresses. Logs and `.backup.json` have names
        of projects, folders and clients: replace them with generic names (`ProjectA`, `FolderB`)
        before pasting. Do not attach `.pln`, `.BIMProject` or `.BIMLibrary` files.

        Não cole senhas, tokens nem endereços internos. Troque os nomes de projetos, pastas e
        clientes por genéricos antes de colar. Não anexe arquivos `.pln`, `.BIMProject` ou
        `.BIMLibrary`.
  - type: textarea
    id: description
    attributes:
      label: What happened? / O que aconteceu?
      description: The problem and what you expected. / O problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Passos para reproduzir
      placeholder: |
        1. I set ...
        2. I clicked ...
        3. The error ... showed up
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error message (mensagem de erro)
      description: >-
        The logs are in / Os logs ficam em %LOCALAPPDATA%\BIMcloudSaaS-LocalBackup\logs.
      render: text
  - type: input
    id: version
    attributes:
      label: Program version / Versão do programa
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Versão do Windows
      placeholder: "Windows 11 23H2"
  - type: input
    id: archicad
    attributes:
      label: Archicad / BIMcloud version (versão)
      placeholder: "Archicad 28"
