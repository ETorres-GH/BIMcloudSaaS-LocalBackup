name: 💡 Feature request / Sugerir funcionalidade
description: An idea to improve the program. / Ideia de melhoria ou nova funcionalidade.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        English or Portuguese are both fine. / Pode escrever em inglês ou português.

        Do not paste passwords, tokens or names of the office's projects or clients; use generic
        names. / Não cole senhas, tokens nem nomes de projetos ou clientes; use nomes genéricos.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve? / Qual problema isso resolve?
      placeholder: "Today, when I ..., ... happens"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / Solução proposta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternativas consideradas
