# Example configuration. The program's window creates and edits this file in
# %APPDATA%\BIMcloudSaaS-LocalBackup\config.toml; editing it by hand is only needed on Server Core.

[bimcloud]
# Address you open in the browser to reach BIMcloud Manager.
server_url = "https://example.bimcloud.com"

# Do not change it, unless support asks.
client_id = "bimcloud-localbackup"

# Optional: fills in the user on the login page.
username = "user@example.com"

# BIMcloud folders to copy, with the path from the root (e.g. ["Works/2026"]).
# Empty = the whole BIMcloud.
source_folders = []

# Projects and libraries chosen one by one, besides the folders (e.g. ["Works/ProjectA"]).
source_projects = []
source_libraries = []

# The password is not here: the sign-in happens in the browser, with "Sign in to BIMcloud".

[backup]
# Folder where the backups are written (use / or \\ in the path).
directory = "D:/BIMcloud-Backups"

# What to copy. "files" are the files that are neither projects nor libraries.
include_projects = true
include_libraries = true
include_files = true

# How projects are saved: "bimproject", "pln" (the latest .pln of BIMcloud) or "both".
projects_format = "bimproject"

# Includes BIMcloud's snapshots in the .BIMProject and the .BIMLibrary (much larger files).
include_backups_in_export = false
include_backups_in_library_export = false

# "history": keeps retention_days days of backups.  "latest": only the last one.
versioning = "history"
retention_days = 30

# The N most recent backups are never deleted.
min_backups_to_keep = 1

# Stops the backup after this time (0 = no limit).
max_duration_hours = 4

# Stops the backup if the free space falls below this (0 = do not check).
min_free_space_gb = 10

# How many files to download at the same time (1 to 8).
parallel_downloads = 3

# Gives up a project or library that stays this long (minutes) with no progress on BIMcloud.
export_stall_minutes = 20

[schedule]
# Every `every` units: "minutes" (1 to 1439), "hours" (1 to 23) or "days" (1 to 365).
# With "days", the backup runs at run_at.
every = 1
unit = "days"
run_at = "23:00"

# Windows notification when an automatic backup fails.
notify_failures = true

# Runs even with nobody signed in to Windows (servers). Asks for the Windows password when
# scheduling.
run_logged_off = false

[logging]
# Detailed log, only to look into problems.
verbose = false

[interface]
# Language of the window, the messages and the log: "en" (English) or "pt-BR" (Português).
language = "en"
